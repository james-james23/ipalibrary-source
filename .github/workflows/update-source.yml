name: Update IPALibrary source

on:
  schedule:
    - cron: "23 4 * * *"        # every day at 04:23 UTC (an off-peak minute on purpose)
  workflow_dispatch:             # adds a "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:                       # re-run when the scraper itself changes
      - scraper.py
      - requirements.txt
      - .github/workflows/update-source.yml

# No permissions by default; each job below asks only for what it needs.
permissions: {}

# Never run two updates at once (they could collide when pushing).
concurrency:
  group: update-source
  cancel-in-progress: false

jobs:
  # Job 1 runs the scraper and the third-party Python packages.
  # It can only READ the repository and has no push credentials at all.
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build the source file
        env:
          # Stored inside the JSON so clients know where it is hosted.
          SOURCE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/ipalibrary_source.json
        run: python scraper.py

      - name: Hand the result to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-json
          path: ipalibrary_source.json
          if-no-files-found: error
          retention-days: 3

  # Job 2 only commits the finished file. It runs no scraper code and no
  # third-party packages, and it only starts if job 1 succeeded.
  publish:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the new source file
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-json
          path: .

      - name: Commit only if something changed
        run: |
          if [ -z "$(git status --porcelain -- ipalibrary_source.json)" ]; then
            echo "Source file is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ipalibrary_source.json
          git commit -m "Update source ($(date -u +%Y-%m-%d))"
          git push
